.vdm{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:24px;width:min(620px,96vw);max-height:92vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.14)}

/* COMPLETED HISTORY */
.comp-hdr{display:flex;align-items:center;justify-content:space-between;margin:20px 0 12px;padding-top:16px;border-top:2px solid #e2e8f0;flex-wrap:wrap;gap:8px}
.comp-hdr-left{display:flex;align-items:center;gap:10px}
.comp-hdr-title{font-size:13px;font-weight:700;color:#475569;font-family:"IBM Plex Mono",monospace;text-transform:uppercase;letter-spacing:.5px}
.comp-count{background:#e2e8f0;color:#64748b;font-size:10px;padding:2px 9px;border-radius:20px;font-weight:700;font-family:"IBM Plex Mono",monospace}
.comp-filt{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.comp-filt input{background:#fff;color:#1e293b;border:1px solid #e2e8f0;border-radius:7px;padding:5px 9px;font-size:11px;font-family:"IBM Plex Sans",sans-serif;outline:none;width:130px}
.comp-filt select{background:#fff;color:#1e293b;border:1px solid #e2e8f0;border-radius:7px;padding:5px 9px;font-size:11px;font-family:"IBM Plex Sans",sans-serif;outline:none}
.tr.done{opacity:.9}
.done-bar{margin-top:6px;padding:5px 10px;background:#f0fdf4;border-radius:6px;font-size:11px;color:#15803d;display:flex;gap:14px;flex-wrap:wrap;align-items:center;border:1px solid #bbf7d0}
.done-bar strong{color:#0f172a}
.prev-rep{font-size:10px;color:#94a3b8;font-family:"IBM Plex Mono",monospace;margin-top:3px;font-style:italic}
</style>

// JOTFORM SYNC
async function syncJotform(){
  if(!jfKey){showApiSetup();return;}setSt('Syncing...','#f97316');
  try{
    var r=await fetch('https://api.jotform.com/form/'+FORM_ID+'/submissions?apiKey='+jfKey+'&limit=100&orderby=created_at,DESC');
    var d=await r.json();if(d.responseCode!==200)throw new Error(d.message);
    var added=0,newOnes=[];
    (d.content||[]).forEach(function(sub){
      var id='jf-'+sub.id;if(tickets.find(function(t){return t.id===id;}))return;
      var ans=sub.answers||{};
      function byL(lbl){var a=Object.values(ans).find(function(a){return a.text&&a.text.toLowerCase().includes(lbl.toLowerCase());});return a?(typeof a.answer==='object'?Object.values(a.answer).filter(Boolean).join(' '):(a.answer||'')):'';};
      var desc=byL('brief description')||byL('problem')||'(No description)';
      var loc=byL('location')||'Unknown';var by=byL('submitted by')||byL('your name')||'Unknown';
      var priRaw=byL('priority')||'';var safety=(byL('safety')||byL('hazard')||'').toLowerCase().includes('yes');
      var details=byL('additional')||byL('details')||'';var assigned=byL('assigned to')||'';
      var expDate=byL('expected')||byL('arrival')||'';
      var majorRaw=byL('major project')||byL('anticipate')||'';
      var isMajor=majorRaw.toLowerCase().includes('yes')||majorRaw.toLowerCase().includes('major')||null;
      var pri='Please Schedule';var pl=priRaw.toLowerCase();
      if(pl.includes('urgent'))pri='Urgent';else if(pl.includes('asap'))pri='ASAP';else if(pl.includes('invest'))pri='Needs Investigation';else if(pl.includes('pending'))pri='Pending Approval';else if(pl.includes('exec')||pl.includes('director'))pri='Referred to ED';
      tickets.unshift({id:id,date:sub.created_at?sub.created_at.slice(0,10):tod,by:by,loc:loc,desc:desc,pri:pri,safety:safety,details:details,status:'Submitted',assigned:assigned,expectedDate:expDate,contacted:false,sched:expDate||'',done:null,notes:'',type:staff.includes(assigned)?'internal':assigned?'vendor':'',source:'jotform',isMajor:isMajor,procPath:null,bidStaff:'',bidDue:'',bids:emptyBids(),edStatus:null,edNote:'',edDate:'',edSubmitted:'',comments:[]});newOnes.push(tickets[0]);added++;
    });
    if(newOnes.length){var up=await sb.from('tickets').upsert(newOnes.map(toRow),{onConflict:'id',ignoreDuplicates:true});if(up.error)throw new Error(up.error.message);}setSt('Synced - '+added+' new - '+new Date().toLocaleTimeString(),'#15803d');render();
  }catch(e){setSt('Sync failed - check API key','#dc2626');console.error(e);}
}

function buildCal(){
  var cd=new Date(now.getFullYear(),now.getMonth()+calOff,1);
  var y=cd.getFullYear(),m=cd.getMonth(),mn=cd.toLocaleString('default',{month:'long'});
  var fd=new Date(y,m,1).getDay(),dim=new Date(y,m+1,0).getDate();
  var ss=new Set(tickets.filter(function(t){return t.sched&&t.status!=='Complete';}).map(function(t){return t.sched;}));
  var us=new Set(tickets.filter(function(t){return t.sched&&t.pri==='Urgent'&&t.status!=='Complete';}).map(function(t){return t.sched;}));
  var card=mk('div','cal');
  var nav=mk('div','cal-nav');var pb=mk('button','','<');pb.onclick=function(){calOff--;renderSidebar();};var nb=mk('button','','>');nb.onclick=function(){calOff++;renderSidebar();};var tb=mk('button','cal-today','TODAY');tb.onclick=function(){calOff=0;renderSidebar();};

  nav.appendChild(mk('span','cal-mo',mn.toUpperCase()+' '+y));nav.appendChild(nr);card.appendChild(nav);
  var g=mk('div','cal-g');
  ['S','M','T','W','T','F','S'].forEach(function(d){g.appendChild(mk('div','cal-dow',d));});
  for(var i=0;i<fd;i++)g.appendChild(mk('div',''));
  for(var d=1;d<=dim;d++){
    var ds=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    var cell=mk('div','cal-d',d);
    if(ds===tod)cell.classList.add('it');else if(us.has(ds))cell.classList.add('iu');else if(ss.has(ds))cell.classList.add('hw');
    g.appendChild(cell);
  }
  card.appendChild(g);
  var up=mk('div','up-sep');up.appendChild(mk('div','up-ttl','Upcoming Work'));
  var ul=tickets.filter(function(t){return t.sched&&t.status!=='Complete';}).sort(function(a,b){return a.sched.localeCompare(b.sched);}).slice(0,5);
  if(!ul.length){var n=mk('div','','None scheduled');n.style.cssText='color:#cbd5e1;font-size:10px;text-align:center;padding:6px 0';up.appendChild(n);}

function renderCompleted(){
  var comp=tickets.filter(function(t){return t.status==='Complete';});
  var cl=document.getElementById('clist');if(!cl)return;cl.innerHTML='';
  if(!tickets.length)return;
  // Header
  var hdr=mk('div','comp-hdr');
  var left=mk('div','comp-hdr-left');
  left.appendChild(mk('span','comp-hdr-title','✓ Completed Repairs'));
  left.appendChild(mk('span','comp-count',comp.length+' records'));
  hdr.appendChild(left);
  // Filters
  var fRow=mk('div','comp-filt');
  var cSearch='',cLoc='All Locations',cYear='All Years',cAsgn='All Staff/Vendors';
  function fs(ph,w,cb){var i=document.createElement('input');i.type='text';i.placeholder=ph;i.style.cssText='background:#fff;color:#1e293b;border:1px solid #e2e8f0;border-radius:7px;padding:5px 9px;font-size:11px;font-family:"IBM Plex Sans",sans-serif;outline:none;width:'+w;i.oninput=function(e){cb(e.target.value);};return i;}
  function fsel(opts,cb){var s=document.createElement('select');s.style.cssText='background:#fff;color:#1e293b;border:1px solid #e2e8f0;border-radius:7px;padding:5px 9px;font-size:11px;font-family:"IBM Plex Sans",sans-serif;outline:none';opts.forEach(function(o){var opt=document.createElement('option');opt.value=o;opt.textContent=o;s.appendChild(opt);});s.onchange=function(e){cb(e.target.value);};return s;}
  fRow.appendChild(fs('Search records...','140px',function(v){cSearch=v;redraw();}));
  var locs=['All Locations'].concat(Array.from(new Set(comp.map(function(t){return t.loc;}).filter(Boolean).sort())));
  fRow.appendChild(fsel(locs,function(v){cLoc=v;redraw();}));
  var years=['All Years'].concat(Array.from(new Set(comp.map(function(t){return (t.done||t.date||'').slice(0,4);}).filter(Boolean).sort().reverse())));
  fRow.appendChild(fsel(years,function(v){cYear=v;redraw();}));
  var asgns=['All Staff/Vendors'].concat(Array.from(new Set(comp.map(function(t){return t.assigned;}).filter(Boolean).sort())));
  fRow.appendChild(fsel(asgns,function(v){cAsgn=v;redraw();}));
  hdr.appendChild(fRow);cl.appendChild(hdr);
  var rows=mk('div','');rows.id='comp-rows';cl.appendChild(rows);
  function redraw(){
    var shown=comp.filter(function(t){
      var q=cSearch.toLowerCase();
      var mQ=!q||[t.desc,t.loc,t.assigned,t.notes,t.by].some(function(f){return (f||'').toLowerCase().includes(q);});
      var mL=cLoc==='All Locations'||t.loc===cLoc;
      var mY=cYear==='All Years'||(t.done||t.date||'').startsWith(cYear);
      var mA=cAsgn==='All Staff/Vendors'||t.assigned===cAsgn;
      return mQ&&mL&&mY&&mA;
    });
    shown.sort(function(a,b){return (b.done||b.date||'').localeCompare(a.done||a.date||'');});
    var rd=document.getElementById('comp-rows');if(!rd)return;rd.innerHTML='';
    if(!shown.length){var n=mk('div','');n.style.cssText='color:#94a3b8;text-align:center;padding:24px;font-size:12px';n.textContent=comp.length?'No records match filters':'No completed repairs yet';rd.appendChild(n);return;}
    shown.forEach(function(t){
      var row=buildRow(t);row.classList.add('done');
      var body=row.querySelector('.tb');
      if(body){
        // Completion bar
        var dm=mk('div','done-bar');
        if(t.done){var s1=document.createElement('span');s1.innerHTML='Completed: <strong>'+t.done+'</strong>';dm.appendChild(s1);}
        if(t.assigned){var s2=document.createElement('span');s2.innerHTML='Done by: <strong>'+t.assigned+'</strong>';dm.appendChild(s2);}
        if(t.type){var s3=document.createElement('span');s3.innerHTML='Type: <strong>'+(t.type==='internal'?'Internal Staff':'External Vendor')+'</strong>';dm.appendChild(s3);}
        body.appendChild(dm);
        // Previous repair at same location
        var prev=comp.filter(function(x){return x.loc===t.loc&&x.id!==t.id;}).sort(function(a,b){return (b.done||b.date||'').localeCompare(a.done||a.date||'');});
        if(prev.length){
          var pr=mk('div','prev-rep');
          pr.textContent='🔁 Previous repair here: '+prev[0].desc.slice(0,50)+(prev[0].desc.length>50?'...':'')+' ('+(prev[0].done||prev[0].date||'unknown')+') by '+(prev[0].assigned||'Unknown');
          body.appendChild(pr);
        }
      }
      rd.appendChild(row);
    });
  }
  redraw();
}

  var ov=mk('div','mov');ov.onclick=function(e){if(e.target===ov)showVendors();};
  var box=mk('div','mbox');box.style.maxWidth='480px';var hdr=mk('div','mhdr');hdr.appendChild(mk('div','mtl',ex?'Edit: '+ex.name:isS?'Add Staff':'Add New Vendor'));var xb=mk('button','mcl','X');xb.onclick=showVendors;hdr.appendChild(xb);box.appendChild(hdr);
  if(isS){var nf=mk('div','ff');nf.style.marginBottom='16px';nf.appendChild(mk('label','','Name'));var ni=inp('','e.g. Marcus','');nf.appendChild(ni);box.appendChild(nf);var a=mk('div','mact');var cn=mk('button','bcn','Cancel');cn.onclick=showVendors;var sv=mk('button','bsv','Add');sv.onclick=function(){var n=ni.value.trim();if(!n){alert('Enter a name.');return;}if(!staff.includes(n))staff.push(n);saveV();showVendors();};a.appendChild(cn);a.appendChild(sv);box.appendChild(a);ov.appendChild(box);root.appendChild(ov);return;}
  var dr={id:ex?ex.id:uid(),name:ex?ex.name:'',trade:ex?ex.trade:'',phone:ex?ex.phone:'',email:ex?ex.email:'',contract:ex?ex.contract:false};
  var g=mk('div','fg');var nf2=mk('div','ff');nf2.appendChild(mk('label','','Company Name *'));var ni2=inp(dr.name,'Albany Roofing Co.',function(v){dr.name=v;});nf2.appendChild(ni2);g.appendChild(nf2);var tf=mk('div','ff');tf.appendChild(mk('label','','Trade'));var ti=inp(dr.trade,'Plumbing, HVAC...',function(v){dr.trade=v;});tf.appendChild(ti);g.appendChild(tf);var pf=mk('div','ff');pf.appendChild(mk('label','','Phone'));var pi=inp(dr.phone,'518-555-0000',function(v){dr.phone=v;});pf.appendChild(pi);g.appendChild(pf);var ef=mk('div','ff');ef.appendChild(mk('label','','Email'));var ei=inp(dr.email,'vendor@email.com',function(v){dr.email=v;});ef.appendChild(ei);g.appendChild(ef);box.appendChild(g);
  var cd2=mk('div','ck');cd2.style.marginBottom='20px';var cb=document.createElement('input');cb.type='checkbox';cb.checked=dr.contract;cb.id='vc';cb.style.cssText='width:15px;height:15px;accent-color:#f97316';cb.onchange=function(e){dr.contract=e.target.checked;};var clb=mk('label','','Contract / agreement on file');clb.setAttribute('for','vc');clb.style.cssText='color:#475569;font-size:13px;cursor:pointer';cd2.appendChild(cb);cd2.appendChild(clb);box.appendChild(cd2);
  var a=mk('div','mact');if(ex){var db=mk('button','bdn','Delete');db.onclick=function(){if(confirm('Remove "'+ex.name+'"?')){vendors=vendors.filter(function(v){return v.id!==ex.id;});saveV();showVendors();}};a.appendChild(db);}
  var cn=mk('button','bcn','Cancel');cn.onclick=showVendors;var sv=mk('button','bsv',ex?'Save Changes':'Add Vendor');sv.onclick=function(){dr.name=ni2.value.trim();dr.trade=ti.value.trim();dr.phone=pi.value.trim();dr.email=ei.value.trim();if(!dr.name){alert('Company name required.');return;}if(ex){var idx=vendors.findIndex(function(v){return v.id===ex.id;});vendors[idx]=Object.assign({},dr);}else vendors.push(Object.assign({},dr));saveV();showVendors();};
  a.appendChild(cn);a.appendChild(sv);box.appendChild(a);ov.appendChild(box);root.appendChild(ov);
}

// VENDOR LOOKUP (Jotform-powered)
function priorityOrder(p){if(!p)return 99;if(p.includes('1st'))return 1;if(p.includes('2nd'))return 2;if(p.includes('3rd'))return 3;if(p.includes('As Needed'))return 4;return 5;}
function priorityBadgeCls(p){if(!p)return 'pnp';if(p.includes('1st'))return 'p1';if(p.includes('2nd'))return 'p2';if(p.includes('3rd'))return 'p3';if(p.includes('As Needed'))return 'pan';return 'pnp';}
function priorityLabel(p){if(!p||p.includes('No Preference'))return '';if(p.includes('1st'))return '⭐ 1st Choice';if(p.includes('2nd'))return '2nd Choice';if(p.includes('3rd'))return '3rd Choice';if(p.includes('As Needed'))return 'As Needed';return p.slice(0,12);}
function statusCls(st){if(!st)return 'nw';var s=st.toLowerCase();if(s.includes('contract'))return 'ct';if(s.includes('ok to use')||s.includes('approved'))return 'ok';if(s.includes('not top'))return 'np';if(s.includes('do not'))return 'dn';return 'nw';}
function statusLabel(st){if(!st)return 'Unknown';if(st.includes('Contract'))return 'CONTRACT';if(st.includes('OK To Use')||st.includes('Approved'))return 'APPROVED';if(st.includes('Not Top'))return 'NOT TOP';if(st.includes('Do Not'))return 'DO NOT CALL';return 'PENDING';}
function parseVendorSub(sub){
  var ans=sub.answers||{};
  function byL(lbl){var a=Object.values(ans).find(function(a){return a.text&&a.text.toLowerCase().includes(lbl.toLowerCase());});return a?(typeof a.answer==='object'?Object.values(a.answer).filter(Boolean).join(' '):(a.answer||'')):'';};
  return {submissionId:sub.id,company:byL('Company Name'),trade:byL('Trade'),contact:byL('Contact Name'),phone1:byL('Phone (Primary)'),phone2:byL('Phone (Secondary'),email:byL('Email'),status:byL('Vendor Status'),priority:byL('Preferred Priority')||byL('Priority'),acct:byL('Account'),contractEnd:byL('Contract End'),insurance:byL('Insurance'),notes:byL('Notes')};
}
async function loadVendorsFromJotform(){
  if(!jfKey){showApiSetup();return;}showVendorLookup(true);
  try{var r=await fetch('https://api.jotform.com/form/'+VF_ID+'/submissions?apiKey='+jfKey+'&limit=200&orderby=created_at,DESC');var d=await r.json();if(d.responseCode!==200)throw new Error(d.message);jfVendors=(d.content||[]).map(parseVendorSub).filter(function(v){return v.company;});jfVendors.sort(function(a,b){return a.company.localeCompare(b.company);});}catch(e){console.error('Vendor load failed',e);jfVendors=[];}
  showVendorLookup(false);
}
function showVendorLookup(loading){
  var root=document.getElementById('vlroot');root.innerHTML='';
  var ov=mk('div','vlov');
  var hdr=mk('div','vlhdr');hdr.appendChild(mk('span','','🏢'));hdr.appendChild(mk('h2','','Vendor Directory'));
  var addBtn=mk('button','vlhbtn bl','+ Add Vendor');addBtn.onclick=function(){window.open('https://form.jotform.com/262655377118060','_blank');};hdr.appendChild(addBtn);
  var jfBtn=mk('button','vlhbtn','📊 Jotform Table');jfBtn.onclick=function(){window.open('https://www.jotform.com/tables/262655377118060','_blank');};hdr.appendChild(jfBtn);
  var refBtn=mk('button','vlhbtn','↻ Refresh');refBtn.onclick=loadVendorsFromJotform;hdr.appendChild(refBtn);
  var closeBtn=mk('button','vlhbtn','X Close');closeBtn.onclick=function(){root.innerHTML='';};hdr.appendChild(closeBtn);
  ov.appendChild(hdr);
  if(loading){var lb=mk('div','vl-loading');lb.innerHTML='<div class="vl-spin"></div> Loading vendors from Jotform...';ov.appendChild(lb);root.appendChild(ov);return;}
  var tb=mk('div','vltb');
  var vlSearch='',vlTrade='All',vlStatus='All Statuses';
  var si=document.createElement('input');si.type='text';si.placeholder='Search vendors...';si.style.cssText='min-width:200px;flex:1;background:#fff;color:#1e293b;border:1px solid #e2e8f0;border-radius:7px;padding:7px 11px;font-size:12px;font-family:"IBM Plex Sans",sans-serif;outline:none';si.oninput=function(e){vlSearch=e.target.value;renderGrid();};tb.appendChild(si);
  var trades=['All'].concat(Array.from(new Set(jfVendors.map(function(v){return v.trade;}).filter(Boolean).sort())));
  var tsel=document.createElement('select');tsel.style.cssText='background:#fff;color:#1e293b;border:1px solid #e2e8f0;border-radius:7px;padding:7px 11px;font-size:12px;font-family:"IBM Plex Sans",sans-serif;outline:none';trades.forEach(function(t){var o=document.createElement('option');o.value=t;o.textContent=t;tsel.appendChild(o);});tsel.onchange=function(e){vlTrade=e.target.value;renderGrid();};tb.appendChild(tsel);
  var ssel=document.createElement('select');ssel.style.cssText=tsel.style.cssText;['All Statuses','Contract - Active Agreement','OK To Use - Approved Vendor','New - Pending Review','Not Top Priority','Do Not Call'].forEach(function(s){var o=document.createElement('option');o.value=s;o.textContent=s;ssel.appendChild(o);});ssel.onchange=function(e){vlStatus=e.target.value;renderGrid();};tb.appendChild(ssel);
  var sortMode='alpha';var sortBtn=mk('button','vlhbtn','Sort by Priority');sortBtn.onclick=function(){if(sortMode==='alpha'){sortMode='priority';sortBtn.textContent='Sort A-Z';jfVendors.sort(function(a,b){return priorityOrder(a.priority)-priorityOrder(b.priority)||a.company.localeCompare(b.company);});}else{sortMode='alpha';sortBtn.textContent='Sort by Priority';jfVendors.sort(function(a,b){return a.company.localeCompare(b.company);});}renderGrid();};tb.appendChild(sortBtn);
  var vtog=mk('div','vtog');var gBtn=mk('button','vtbtn active','Grid');gBtn.onclick=function(){vlViewMode='grid';gBtn.classList.add('active');tBtn.classList.remove('active');renderGrid();};var tBtn=mk('button','vtbtn','By Trade');tBtn.onclick=function(){vlViewMode='trade';tBtn.classList.add('active');gBtn.classList.remove('active');renderGrid();};vtog.appendChild(gBtn);vtog.appendChild(tBtn);tb.appendChild(vtog);
  var stats=mk('div','vlst',jfVendors.length+' vendors');stats.id='vl-stats';tb.appendChild(stats);
  ov.appendChild(tb);var body=mk('div','vlbody');body.id='vlbody';ov.appendChild(body);root.appendChild(ov);
  function buildCard(v){
    var card=mk('div','vc');var top=mk('div','vc-top');top.appendChild(mk('div','vc-name',v.company));var bdgs=mk('div','vc-badges');bdgs.appendChild(mk('span','vb '+statusCls(v.status),statusLabel(v.status)));if(v.priority&&!v.priority.includes('No Preference'))bdgs.appendChild(mk('span','vb '+priorityBadgeCls(v.priority),priorityLabel(v.priority)));top.appendChild(bdgs);card.appendChild(top);
    if(v.trade)card.appendChild(mk('div','vc-trade',v.trade));if(v.contact)card.appendChild(mk('div','vc-contact','👤 '+v.contact));
    if(v.phone1){var ph=mk('div','vc-phone','📞 '+v.phone1);ph.onclick=function(e){e.stopPropagation();navigator.clipboard.writeText(v.phone1).then(function(){ph.textContent='Copied!';setTimeout(function(){ph.textContent='📞 '+v.phone1;},1500);});};card.appendChild(ph);}
    if(v.phone2){var ph2=mk('div','vc-phone','📱 '+v.phone2);ph2.onclick=function(e){e.stopPropagation();navigator.clipboard.writeText(v.phone2).then(function(){ph2.textContent='Copied!';setTimeout(function(){ph2.textContent='📱 '+v.phone2;},1500);});};card.appendChild(ph2);}
    if(v.email)card.appendChild(mk('div','vc-email','✉ '+v.email));if(v.acct)card.appendChild(mk('div','vc-acct','# '+v.acct));
    if(v.notes){var nt=mk('div','vc-notes',v.notes.length>80?v.notes.slice(0,80)+'...':v.notes);card.appendChild(nt);}
    card.onclick=function(){showVendorDetail(v,root);};return card;
  }
  function renderGrid(){
    var shown=jfVendors.filter(function(v){var q=vlSearch.toLowerCase();var mQ=!q||[v.company,v.contact,v.phone1,v.phone2,v.email,v.trade,v.notes].some(function(f){return (f||'').toLowerCase().includes(q);});var mT=vlTrade==='All'||v.trade===vlTrade;var mS=vlStatus==='All Statuses'||v.status.includes(vlStatus.split(' - ')[0]);return mQ&&mT&&mS;});
    var st=document.getElementById('vl-stats');if(st)st.textContent=shown.length+' of '+jfVendors.length+' vendors';
    var b=document.getElementById('vlbody');if(!b)return;b.innerHTML='';
    if(!shown.length){var e=mk('div','vl-empty');e.innerHTML='<div style="font-size:40px;margin-bottom:12px">🔍</div><div style="font-size:14px;font-weight:600;color:#475569">No vendors match</div>';b.appendChild(e);return;}
    if(vlViewMode==='trade'){
      var tradeMap={};shown.forEach(function(v){var t=v.trade||'Other';if(!tradeMap[t])tradeMap[t]=[];tradeMap[t].push(v);});
      Object.keys(tradeMap).sort().forEach(function(trade){var group=tradeMap[trade];group.sort(function(a,b){return priorityOrder(a.priority)-priorityOrder(b.priority)||a.company.localeCompare(b.company);});var tg=mk('div','tg');var tgh=mk('div','tghdr');tgh.appendChild(mk('span','tgname',trade));tgh.appendChild(mk('span','tgct',group.length+' vendor'+(group.length!==1?'s':'')));tg.appendChild(tgh);var tgrid=mk('div','vcgrid');group.forEach(function(v){tgrid.appendChild(buildCard(v));});tg.appendChild(tgrid);b.appendChild(tg);});
    }else{var grid=mk('div','vcgrid');shown.forEach(function(v){grid.appendChild(buildCard(v));});b.appendChild(grid);}
  }
  renderGrid();
}
function showVendorDetail(v,root){
  var existing=document.getElementById('vd-ov');if(existing)existing.remove();
  var ov=mk('div','mov');ov.id='vd-ov';ov.onclick=function(e){if(e.target===ov)ov.remove();};
  var box=mk('div','vdm');var hdr=mk('div','mhdr');var info=mk('div','');
  var sb=mk('span','vb '+statusCls(v.status),statusLabel(v.status));sb.style.cssText='margin-bottom:6px;display:inline-block';info.appendChild(sb);
  if(v.priority&&!v.priority.includes('No Preference')){var pb=mk('span','vb '+priorityBadgeCls(v.priority),priorityLabel(v.priority));pb.style.cssText='margin-bottom:6px;display:inline-block;margin-left:4px';info.appendChild(pb);}
  info.appendChild(mk('div','mtl',v.company));if(v.trade)info.appendChild(mk('div','msb',v.trade));
  var xb=mk('button','mcl','X');xb.onclick=function(){ov.remove();};hdr.appendChild(info);hdr.appendChild(xb);box.appendChild(hdr);
  var g=mk('div','fg');
  function addItem(lbl,val,cls){if(!val)return;var d=mk('div','');d.appendChild(mk('div','',lbl));var vEl=mk('div','',val);vEl.style.cssText='font-size:13px;font-weight:500;color:'+(cls==='phone'?'#0369a1':cls==='email'?'#7c3aed':'#1e293b');if(cls==='phone')vEl.onclick=function(){navigator.clipboard.writeText(val);};if(cls==='email')vEl.onclick=function(){window.location.href='mailto:'+val;};vEl.style.cursor=(cls==='phone'||cls==='email')?'pointer':'default';d.appendChild(vEl);g.appendChild(d);}
  addItem('Contact Person',v.contact);addItem('Primary Phone',v.phone1,'phone');addItem('Secondary Phone',v.phone2,'phone');addItem('Email',v.email,'email');addItem('Account / Contract #',v.acct);addItem('Contract End',v.contractEnd);if(v.priority&&!v.priority.includes('No Preference'))addItem('Preferred Priority',priorityLabel(v.priority));
  box.appendChild(g);
  if(v.notes){var ns=mk('div','');ns.style.cssText='background:#f8fafc;border:1px solid #f1f5f9;border-radius:8px;padding:10px 13px;color:#475569;font-size:12px;line-height:1.6;margin-top:12px';ns.textContent=v.notes;box.appendChild(ns);}
  var acts=mk('div','mact');var editBtn=mk('button','bpr','Edit in Jotform');editBtn.onclick=function(){window.open('https://www.jotform.com/edit/'+v.submissionId,'_blank');};var closeBtn=mk('button','bcn','Close');closeBtn.onclick=function(){ov.remove();};acts.appendChild(closeBtn);acts.appendChild(editBtn);box.appendChild(acts);
  ov.appendChild(box);(root||document.getElementById('vlroot')).appendChild(ov);
}

// API KEY SETUP
function showApiSetup(){
  var root=document.getElementById('sroot');root.innerHTML='';
  var ov=mk('div','sov');ov.onclick=function(e){if(e.target===ov)root.innerHTML='';};
  var box=mk('div','sbox');box.appendChild(mk('h2','','🔗 Jotform API Key'));box.appendChild(mk('div','ssub','Optional. New form submissions now arrive in the dashboard automatically. A key is only needed to manually re-pull older submissions with Sync Form.'));
  var steps=mk('div','ssteps');steps.innerHTML='<ol><li>Go to <a href="https://www.jotform.com/myaccount/api" target="_blank">jotform.com/myaccount/api</a></li><li>Click <strong>Create New Key</strong> - name it <code>STEAM Garden</code></li><li>Paste the key below and click Connect</li></ol>';box.appendChild(steps);
  var row=mk('div','srow');var ki=document.createElement('input');ki.type='text';ki.placeholder='Paste Jotform API key...';ki.value=jfKey||'';var kb=mk('button','','Connect & Sync');kb.onclick=function(){var k=ki.value.trim();if(!k)return;jfKey=k;localStorage.setItem(LS_K,k);root.innerHTML='';syncJotform();};row.appendChild(ki);row.appendChild(kb);box.appendChild(row);
  if(jfKey){var di=mk('div','');di.style.cssText='margin-top:6px;font-size:11px;color:#64748b;font-family:"IBM Plex Mono",monospace';di.textContent='Current key: '+jfKey.slice(0,8)+'...';box.appendChild(di);}
  var sk=mk('div','sskip','Skip for now');sk.onclick=function(){root.innerHTML='';};box.appendChild(sk);
  ov.appendChild(box);root.appendChild(ov);
}

init();
